<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playbook · Draft — All22</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
  <script src="/module-icon.js"></script>
  <script src="/module-nav.js"></script>
  <style>
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .meta-item label { font-size: .75rem; color: var(--text-dim); display: block; margin-bottom: 2px; }
    .meta-item span { font-weight: 500; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .78rem; background: var(--border); }
    .badge.suggested { border: 1px solid var(--border); background: none; color: var(--text-dim); font-style: italic; }
    .rating { color: #f5c842; font-size: 1.1rem; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .btn-danger { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
    .btn-danger:hover { filter: brightness(1.2); }
    .table-wrap { overflow-x: auto; margin-top: 12px; }
    table { border-collapse: collapse; width: 100%; min-width: 500px; font-size: .85rem; }
    th { text-align: left; padding: 6px 10px; border-bottom: 2px solid var(--border); color: var(--text-dim); font-weight: 500; white-space: nowrap; }
    td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
    tr.mine td { background: rgba(79,156,249,.09); }
    tr.mine td:first-child { border-left: 3px solid var(--accent); }
    tr:hover td { filter: brightness(1.08); }
    /* Edit form (hidden by default) */
    #edit-section { display: none; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
    .form-grid .full { grid-column: 1 / -1; }
    label.field-label { font-size: .85rem; color: var(--text-dim); margin-bottom: 4px; display: block; }
    .stars { display: flex; gap: 4px; }
    .stars button { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); width: 36px; height: 36px; font-size: 1rem; cursor: pointer; padding: 0; }
    .stars button.active { border-color: var(--accent); color: #f5c842; }
    .notes-pre { white-space: pre-wrap; font-size: .875rem; color: var(--text-dim); margin: 0; }
    /* Analysis */
    .an-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .an-head select { max-width: 150px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: .82rem; }
    .chip b { display: block; font-size: 1.05rem; }
    .chip.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
    .val-pos { color: var(--green); }
    .val-neg { color: var(--red); }
    .tag-badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 12px; font-size: .68rem; font-weight: 600; letter-spacing: .04em; }
    .tag-badge.steal { background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok-text); }
    .tag-badge.reach { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }
    tr.unmatched td { opacity: .55; }
    .lb { margin-top: 12px; font-size: .84rem; }
    .lb td, .lb th { padding: 4px 10px; }
    .an-dials { margin-top: 12px; font-size: .84rem; }
    .an-dials input { width: 64px; }
    .an-dials .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">All<em>22</em></span>
    <a href="/">Hub</a>
    <a href="/combine.html">Combine</a>
    <a href="/myrankings.html">My Rankings</a>
    <a href="/boards.html">Big Board</a>
    <a href="/auction.html">War Chest</a>
    <a href="/drafts.html" class="active">Playbook</a>
    <a href="/adp.html">Edge Rush</a>
    <a href="/players.html">Player DB</a>
    <a href="/notes.html">Notes</a>
    <a href="/wire.html">The Wire</a>
    <a href="/settings.html">Settings</a>
    <form method="POST" action="/logout"><button type="submit" class="link">Log out</button></form>
  </nav>
  <div id="error-banner"></div>
  <main>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <h1 id="page-title" style="margin:0">Draft</h1>
      <a href="/drafts.html" style="font-size:.85rem">← All drafts</a>
    </div>

    <!-- Metadata view -->
    <div id="meta-view" class="card" style="margin-top:14px">
      <div class="meta-grid" id="meta-grid"></div>
      <div class="actions">
        <button type="button" id="edit-btn">Edit</button>
        <button type="button" id="delete-btn" class="btn-danger">Delete</button>
      </div>
    </div>

    <!-- Edit form -->
    <div id="edit-section" class="card" style="margin-top:14px">
      <div class="form-grid">
        <div>
          <label class="field-label" for="e-site">Site</label>
          <select id="e-site">
            <option value="Underdog">Underdog</option>
            <option value="Yahoo">Yahoo</option>
            <option value="Sleeper">Sleeper</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="e-type">Draft Type</label>
          <select id="e-type">
            <option>Best Ball</option><option>Mock</option><option>Season League</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="e-date">Date &amp; Time</label>
          <input type="datetime-local" id="e-date">
        </div>
        <div>
          <label class="field-label" for="e-size">League Size</label>
          <input type="number" id="e-size" min="4" max="24">
        </div>
        <div>
          <label class="field-label" for="e-slot">My Draft Slot</label>
          <input type="number" id="e-slot" min="1" max="24">
        </div>
        <div>
          <label class="field-label" for="e-strategy">Strategy</label>
          <select id="e-strategy">
            <option value="">— choose —</option>
            <option>Hero RB</option><option>Zero RB</option><option>Robust RB</option>
            <option>Anchor TE</option><option>Late-Round QB</option><option>Balanced</option><option>Other</option>
          </select>
        </div>
        <div>
          <label class="field-label">Rating</label>
          <div class="stars" id="e-stars">
            <button type="button" data-v="1">★</button>
            <button type="button" data-v="2">★</button>
            <button type="button" data-v="3">★</button>
            <button type="button" data-v="4">★</button>
            <button type="button" data-v="5">★</button>
          </div>
        </div>
        <div>
          <label class="field-label" for="e-checked-out">Checked out at pick #</label>
          <input type="number" id="e-checked-out" min="1" placeholder="optional">
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding-top:20px">
          <input type="checkbox" id="e-is-test" style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent)">
          <label for="e-is-test" class="field-label" style="margin:0;cursor:pointer">Test draft — exclude from analytics</label>
        </div>
        <div class="full">
          <label class="field-label" for="e-notes">Notes</label>
          <textarea id="e-notes" rows="3" style="min-height:60px"></textarea>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button type="button" id="save-edit-btn">Save Changes</button>
        <button type="button" id="cancel-edit-btn" class="link">Cancel</button>
      </div>
    </div>

    <!-- Analysis -->
    <div id="analysis-card" class="card" style="margin-top:14px">
      <div class="an-head">
        <span style="font-weight:600">Analysis</span>
        <select id="an-format" title="ADP scoring format to grade against"></select>
        <span id="an-board" class="muted" style="font-size:.8rem"></span>
        <button type="button" id="rematch-btn" class="link" style="margin-left:auto;font-size:.82rem" title="Re-match every pick against the Player DB (picks up learned aliases)">Re-match players</button>
      </div>
      <div id="an-body" class="muted" style="margin-top:10px;font-size:.85rem">Loading analysis…</div>
    </div>

    <!-- Picks table -->
    <div style="margin-top:20px">
      <div style="font-weight:600;margin-bottom:6px">
        Pick Board <span class="muted" id="pick-counts" style="font-size:.85rem;font-weight:400"></span>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Rnd</th><th>Player</th><th>Pos</th><th>Team</th><th>Slot</th><th title="Average draft position on the chosen board">ADP</th><th title="Picks past ADP: + = fell to you (value), − = taken early (reach)">+/−</th><th title="Rank in your latest My Rankings run">My Rk</th></tr>
            </thead>
            <tbody id="picks-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = '/drafts.html';

    let draftData = null;
    let editRating = 0;

    async function loadDraft() {
      const data = await apiFetch(`/api/drafts/${id}`).catch(() => null);
      if (!data) return;
      draftData = data;
      renderMeta(data);
      renderPicks(data.picks);
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderMeta(d) {
      document.getElementById('page-title').textContent =
        `${d.site} ${d.draft_type} — ${d.drafted_at ? new Date(d.drafted_at).toLocaleString() : ''}`;

      const strat = d.strategy
        ? `<span class="badge">${esc(d.strategy)}</span>`
        : '<span class="muted">—</span>';
      const suggested = d.suggested_strategy
        ? ` <span class="badge suggested" title="Auto-suggested from your picks">≈ ${esc(d.suggested_strategy)}</span>`
        : '';
      const ratingHtml = d.rating
        ? `<span class="rating">${'★'.repeat(d.rating)}</span>`
        : '<span class="muted">—</span>';

      document.getElementById('meta-grid').innerHTML = `
        <div class="meta-item"><label>Date &amp; Time</label><span>${d.drafted_at ? esc(new Date(d.drafted_at).toLocaleString()) : '—'}</span></div>
        <div class="meta-item"><label>Site</label><span>${esc(d.site)}</span></div>
        <div class="meta-item"><label>Type</label><span>${esc(d.draft_type)}</span></div>
        <div class="meta-item"><label>League Size</label><span>${d.league_size}</span></div>
        <div class="meta-item"><label>My Slot</label><span>${d.my_slot}</span></div>
        <div class="meta-item"><label>Strategy</label>${strat}${suggested}</div>
        <div class="meta-item"><label>Rating</label>${ratingHtml}</div>
        ${d.checked_out_at ? `<div class="meta-item"><label>Checked out at pick</label><span>#${d.checked_out_at}</span></div>` : ''}
        ${d.is_test ? `<div class="meta-item"><label>Flags</label><span class="badge" style="color:#e6a817;border-color:#e6a817">TEST</span></div>` : ''}
        ${d.notes ? `<div class="meta-item" style="grid-column:1/-1"><label>Notes</label><pre class="notes-pre">${esc(d.notes)}</pre></div>` : ''}
      `;
    }

    function renderPicks(picks) {
      const mine = picks.filter((p) => p.is_my_pick);
      const posCounts = {};
      for (const p of mine) {
        const pos = p.position || 'Other';
        posCounts[pos] = (posCounts[pos] || 0) + 1;
      }
      const posOrder = ['QB','RB','WR','TE','K','DST','DEF','Other'];
      const posStr = [
        ...posOrder.filter((p) => posCounts[p]).map((p) => `${posCounts[p]} ${p}`),
        ...Object.keys(posCounts).filter((p) => !posOrder.includes(p)).map((p) => `${posCounts[p]} ${p}`),
      ].join(' · ');
      document.getElementById('pick-counts').textContent =
        `${mine.length} my picks · ${picks.length} total` + (posStr ? ` — ${posStr}` : '');

      // Analysis columns: '—' until /analysis responds (or when no board/run).
      const tagBadge = (t) => t ? ` <span class="tag-badge ${t}">${t.toUpperCase()}</span>` : '';
      const tbody = document.getElementById('picks-body');
      tbody.innerHTML = picks.map((p) => `
        <tr class="${p.is_my_pick ? 'mine' : ''}${p.matched === false ? ' unmatched' : ''}">
          <td>${p.overall_pick}</td>
          <td>${p.round}</td>
          <td>${esc(p.player_name)}${p.is_my_pick ? ' <span style="font-size:.7rem;color:var(--accent)">▶ me</span>' : ''}${tagBadge(p.tag)}${p.matched === false ? ' <span title="Not matched to the Player DB — use Re-match after teaching the alias in Combine or Player DB">⚠</span>' : ''}</td>
          <td>${esc(p.position || '—')}</td>
          <td>${esc(p.nfl_team || '—')}</td>
          <td>${p.draft_slot || '—'}</td>
          <td>${p.adp == null ? '—' : p.adp}</td>
          <td class="${valClass(p.value)}">${fmtVal(p.value)}</td>
          <td>${p.my_rank == null ? '—' : p.my_rank}</td>
        </tr>`
      ).join('');
    }

    // ----- Analysis (Phase 3) -----
    let currentFormat = null;

    const fmtVal = (v) => v == null ? '—' : (v > 0 ? '+' + v : String(v));
    const valClass = (v) => v == null ? '' : (v > 0 ? 'val-pos' : (v < 0 ? 'val-neg' : ''));

    async function loadAnalysis(format) {
      const qs = format ? `?format=${encodeURIComponent(format)}` : '';
      const data = await apiFetch(`/api/drafts/${id}/analysis${qs}`).catch(() => null);
      const body = document.getElementById('an-body');
      if (!data) { body.textContent = 'Analysis unavailable.'; return; }
      currentFormat = data.adp_board ? data.adp_board.format : (format || null);
      renderAnalysis(data);
      renderPicks(data.rows); // re-render the board with ADP/value/my-rank filled in
    }

    function renderAnalysis(data) {
      // Format picker from the boards Edge Rush actually has stored.
      const sel = document.getElementById('an-format');
      const formats = [...new Set((data.boards || []).map((b) => b.format))];
      if (currentFormat && !formats.includes(currentFormat)) formats.unshift(currentFormat);
      sel.innerHTML = formats.map((f) => `<option value="${esc(f)}"${f === currentFormat ? ' selected' : ''}>${esc(f)}</option>`).join('');

      const board = document.getElementById('an-board');
      if (data.adp_board) {
        const k = data.adp_board;
        board.textContent = `${k.site} · ${k.teams === 0 ? 'sitewide' : k.teams + '-team'} · ${k.latest}`;
      } else {
        board.textContent = 'no ADP board stored for this format — Edge Rush hasn’t collected it yet';
      }

      const s = data.summary;
      const unresolved = (data.rows || []).filter((r) => !r.matched).length;
      const chips = [
        `<div class="chip"><b class="${valClass(s.total_value)}">${fmtVal(s.total_value)}</b>my ADP value</div>`,
        `<div class="chip"><b>${s.steals}</b>steals</div>`,
        `<div class="chip"><b>${s.reaches}</b>reaches</div>`,
        s.best_pick && s.best_pick.value > 0 ? `<div class="chip"><b class="val-pos">${esc(s.best_pick.player_name)}</b>best value: #${s.best_pick.overall_pick} vs ADP ${s.best_pick.adp} (${fmtVal(s.best_pick.value)})</div>` : '',
        s.worst_pick && s.worst_pick.value < 0 ? `<div class="chip"><b class="val-neg">${esc(s.worst_pick.player_name)}</b>biggest reach: #${s.worst_pick.overall_pick} vs ADP ${s.worst_pick.adp} (${fmtVal(s.worst_pick.value)})</div>` : '',
        unresolved ? `<div class="chip warn"><b>${unresolved}</b>unmatched name${unresolved === 1 ? '' : 's'} ⚠</div>` : '',
      ].filter(Boolean).join('');

      // My positional balance: counts, rounds spent, ADP value per position.
      const posOrder = ['QB','RB','WR','TE','K','DST','DEF','Other'];
      const posKeys = Object.keys(data.positions || {});
      const posStr = [...posOrder.filter((p) => posKeys.includes(p)), ...posKeys.filter((p) => !posOrder.includes(p))]
        .map((p) => {
          const b = data.positions[p];
          return `${b.count} ${esc(p)} <span class="muted">(rd ${b.rounds.join(',')}${b.value ? ` · <span class="${valClass(b.value)}">${fmtVal(b.value)}</span>` : ''})</span>`;
        }).join(' &nbsp;·&nbsp; ');

      // Draft-room leaderboard: every slot's total ADP value.
      let lb = '';
      if ((data.teams || []).length) {
        lb = `<div class="lb"><div style="font-weight:600;margin-bottom:4px">Draft-room value leaderboard</div>
          <div class="table-wrap"><table style="min-width:280px">
            <thead><tr><th>Rank</th><th>Slot</th><th>ADP value</th><th>Picks</th></tr></thead>
            <tbody>${data.teams.map((t) => `
              <tr class="${t.is_me ? 'mine' : ''}">
                <td>${t.rank}</td>
                <td>${t.slot}${t.is_me ? ' <span style="font-size:.7rem;color:var(--accent)">▶ me</span>' : ''}</td>
                <td class="${valClass(t.value)}">${fmtVal(t.value)}</td>
                <td class="muted">${t.picks}</td>
              </tr>`).join('')}
            </tbody></table></div></div>`;
      }

      const o = data.options;
      const dials = `
        <details class="an-dials">
          <summary style="cursor:pointer;color:var(--text-dim)">Steal/reach thresholds ${data.run ? `· graded vs My Rankings run “${esc(data.run.name || ('#' + data.run.id))}”` : '· no My Rankings run saved yet'}</summary>
          <div class="row">
            <label>Steal ≥ <input type="number" id="d-steal-picks" min="0" value="${o.steal_picks}"> picks and <input type="number" id="d-steal-pct" min="0" value="${o.steal_pct}"> % of ADP</label>
          </div>
          <div class="row">
            <label>Reach ≥ <input type="number" id="d-reach-picks" min="0" value="${o.reach_picks}"> picks and <input type="number" id="d-reach-pct" min="0" value="${o.reach_pct}"> % of ADP</label>
            <button type="button" id="d-save">Save thresholds</button>
          </div>
        </details>`;

      document.getElementById('an-body').innerHTML =
        `<div class="chips">${chips}</div>` +
        (posStr ? `<div style="margin-top:12px">${posStr}</div>` : '') +
        lb + dials;

      document.getElementById('d-save').addEventListener('click', async () => {
        const entries = { 'playbook.analysis': {
          steal_picks: +document.getElementById('d-steal-picks').value || 0,
          steal_pct: +document.getElementById('d-steal-pct').value || 0,
          reach_picks: +document.getElementById('d-reach-picks').value || 0,
          reach_pct: +document.getElementById('d-reach-pct').value || 0,
        } };
        const saved = await apiFetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entries }),
        }).catch(() => null);
        if (saved) { toast('Thresholds saved'); loadAnalysis(currentFormat); }
      });
    }

    document.getElementById('an-format').addEventListener('change', (e) => loadAnalysis(e.target.value));

    document.getElementById('rematch-btn').addEventListener('click', async () => {
      const btn = document.getElementById('rematch-btn');
      btn.disabled = true;
      const data = await apiFetch(`/api/drafts/${id}/resolve`, { method: 'POST' }).catch(() => null);
      btn.disabled = false;
      if (data) {
        toast(`Re-matched ${data.matched} of ${data.attempted} picks`);
        loadAnalysis(currentFormat);
      }
    });

    // Edit
    document.getElementById('edit-btn').addEventListener('click', () => {
      const d = draftData;
      document.getElementById('e-site').value = d.site || '';
      document.getElementById('e-type').value = d.draft_type || '';
      document.getElementById('e-date').value = d.drafted_at ? new Date(d.drafted_at).toISOString().slice(0,16) : '';
      document.getElementById('e-size').value = d.league_size || '';
      document.getElementById('e-slot').value = d.my_slot || '';
      document.getElementById('e-strategy').value = d.strategy || '';
      document.getElementById('e-notes').value = d.notes || '';
      document.getElementById('e-checked-out').value = d.checked_out_at || '';
      document.getElementById('e-is-test').checked = !!d.is_test;
      editRating = d.rating || 0;
      document.querySelectorAll('#e-stars button').forEach((b) => {
        b.classList.toggle('active', +b.dataset.v <= editRating);
      });
      document.getElementById('meta-view').style.display = 'none';
      document.getElementById('edit-section').style.display = '';
    });

    document.getElementById('e-stars').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-v]');
      if (!btn) return;
      const v = +btn.dataset.v;
      editRating = editRating === v ? 0 : v;
      document.querySelectorAll('#e-stars button').forEach((b) => {
        b.classList.toggle('active', +b.dataset.v <= editRating);
      });
    });

    document.getElementById('cancel-edit-btn').addEventListener('click', () => {
      document.getElementById('edit-section').style.display = 'none';
      document.getElementById('meta-view').style.display = '';
    });

    document.getElementById('save-edit-btn').addEventListener('click', async () => {
      const body = {
        site:       document.getElementById('e-site').value,
        draftType:  document.getElementById('e-type').value,
        draftedAt:  document.getElementById('e-date').value,
        leagueSize: document.getElementById('e-size').value,
        mySlot:     document.getElementById('e-slot').value,
        strategy:      document.getElementById('e-strategy').value || null,
        rating:        editRating || null,
        notes:         document.getElementById('e-notes').value.trim() || null,
        isTest:        document.getElementById('e-is-test').checked,
        checkedOutAt:  parseInt(document.getElementById('e-checked-out').value, 10) || null,
      };
      const data = await apiFetch(`/api/drafts/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).catch(() => null);
      if (data) {
        document.getElementById('edit-section').style.display = 'none';
        document.getElementById('meta-view').style.display = '';
        await loadDraft();
      }
    });

    // Delete
    let deleteStep = 0;
    document.getElementById('delete-btn').addEventListener('click', async () => {
      if (deleteStep === 0) {
        document.getElementById('delete-btn').textContent = 'Confirm Delete';
        deleteStep = 1;
        setTimeout(() => {
          document.getElementById('delete-btn').textContent = 'Delete';
          deleteStep = 0;
        }, 4000);
        return;
      }
      const data = await apiFetch(`/api/drafts/${id}`, { method: 'DELETE' }).catch(() => null);
      if (data) window.location.href = '/drafts.html';
    });

    loadDraft().then(() => loadAnalysis());
  </script>
</body>
</html>
